name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o projeto
        uses: actions/checkout@v4

      - name: Instala Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila o APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Guarda o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CapriPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publica o APK em Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Capri Player v1.0
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
